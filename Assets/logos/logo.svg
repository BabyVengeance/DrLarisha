<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 22 196 96" width="196" height="96" fill="none">
  <style>
    .monogram { font-family: 'Playfair Display', 'Cormorant Garamond', Georgia, serif; font-size: 82px; font-weight: 700; fill: #1E1B18; }
    .subtext { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.32em; fill: #1E1B18; text-transform: uppercase; }
    .line { stroke: #D9CBBF; stroke-width: 1; }
  </style>
  <g transform="translate(10, 10)">
